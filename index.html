<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Managers</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #eef3ff, #fafcff); color: #172033; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 3rem; border: 1px solid #dde5f2; border-radius: 1.25rem; background: #fff; box-shadow: 0 18px 50px rgba(23, 32, 51, .12); }
    h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 7vw, 3.25rem); }
    p { margin: .75rem 0; line-height: 1.7; }
    .tag { display: inline-block; margin-bottom: 1.25rem; padding: .4rem .75rem; border-radius: 999px; background: #e8efff; color: #3157a8; font-size: .85rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Manager Portal</span>
    <h1>All Managers</h1>
    <p>A shared workspace for planning, priorities, and thoughtful leadership.</p>
    <p>Good decisions begin with clear goals, useful conversations, and teams that have the context they need to do excellent work.</p>
  </main>
</body>
</html>
